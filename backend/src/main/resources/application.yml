server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  supabase:
    url: ${APP_SUPABASE_URL}
    storage-bucket-cv: ${APP_SUPABASE_STORAGE_BUCKET_CV}
    storage-bucket-linkedin: ${APP_SUPABASE_STORAGE_BUCKET_LINKEDIN}
    anon-key: ${APP_SUPABASE_ANON_KEY}
    service-key: ${APP_SUPABASE_SERVICE_KEY}

upstash:
  url: ${UPSTASH_URL}
  token: ${UPSTASH_TOKEN}

llm-council:
  url: ${LLM_COUNCIL_URL}

groq:
  api-key: ${GROQ_API_KEY}
